<title>Autodiagnóstico docente micro:bit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: asistente de una columna con la identidad del sitio micro:bit de Ceibal — franja verde Ceibal arriba, tarjetas planas
   de color por dimensión (la paleta de "Formación y recursos"), botones píldora, íconos de LEDs 5×5. Tema claro único, como el sitio. */
:root {
  color-scheme: light;
  --bg: #F9FAFB;
  --surface: #FFFFFF;
  --ink: #111111;
  --muted: #4B5563;
  --line: #E5E7EB;
  --teal-dark: #00635D;      /* verde Ceibal: barra superior, botones */
  --teal: #00A096;           /* acentos y enlaces */
  --teal-soft: #E3F3F1;
  --mb-green: #026902;       /* verde micro:bit: bordes de botón secundario */
  --c1: #7BCDC1; --c1-ink: #0E5F55;   /* aqua */
  --c2: #D17EB2; --c2-ink: #6E2357;   /* rosa */
  --c3: #F2E616; --c3-ink: #6B5F00;   /* amarillo */
  --c4: #27B2D9; --c4-ink: #0B4F66;   /* celeste */
  --c5: #E6665D; --c5-ink: #7A1E17;   /* coral */
  --purple: #5A2382;
  --danger: #B42318;
  --font-display: "Ceibal Mozaic", "Figtree", Verdana, sans-serif;
  --font-body: "Ceibal Mozaic", "Figtree", Verdana, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--teal-dark); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; font-weight: 600; }
h1 { font-size: clamp(2rem, 6.5vw, 2.9rem); }
h2 { font-size: clamp(1.55rem, 5vw, 2.1rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--teal-dark); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.proto { background: var(--purple); color: #FFFFFF; font-size: 0.82rem; font-weight: 600; text-align: center; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topband { background: var(--teal-dark); color: #FFFFFF; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-weight: 600; font-size: 0.95rem; }
.topband-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.brand { font-weight: 700; font-size: 1.05rem; white-space: nowrap; color: var(--mb-green); display: flex; align-items: center; gap: 8px; }
.brand .logo-slot { font-size: 0.68rem; font-weight: 600; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 6px; padding: 3px 7px; }
.prog { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.prog-leds { display: flex; gap: 4px; }
.prog-leds i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); display: block; }
.prog-leds i.on { background: var(--teal); }
.prog-leds i.now { background: var(--teal-dark); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--teal-dark); }
@media (max-width: 440px) { .brand .logo-slot { display: none; } .prog > span:first-child { display: none; } }

main { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal-dark); font-weight: 700; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 60ch; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.note { font-size: 0.9rem; color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 0.86em; }

.btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--teal-dark); border-radius: 25px; padding: 11px 24px; font-weight: 700; cursor: pointer; background: var(--teal-dark); color: #FFFFFF; }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--mb-green); }
.btn.white { background: #FFFFFF; color: var(--ink); border-color: #FFFFFF; }
.btn.link { background: none; border: 0; padding: 6px 2px; color: var(--teal-dark); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.nav .hint { font-size: 0.88rem; color: var(--muted); align-self: center; }

/* LEDs 5×5 */
.led5 { display: grid; grid-template-columns: repeat(5, var(--px, 8px)); gap: calc(var(--px, 8px) * 0.35); }
.led5 i { width: var(--px, 8px); height: var(--px, 8px); border-radius: 22%; background: currentColor; opacity: 0.18; display: block; }
.led5 i.on { opacity: 1; }

/* Formulario */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .legend { font-weight: 700; }
.field .help { font-size: 0.86rem; color: var(--muted); }
.field .err { font-size: 0.88rem; color: var(--danger); font-weight: 700; }
input[type=text], input[type=email], select { width: 100%; padding: 12px 16px; border: 1.5px solid #B9C2CC; border-radius: 25px; background: var(--surface); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--teal-dark) 50%), linear-gradient(135deg, var(--teal-dark) 50%, transparent 50%); background-position: calc(100% - 22px) 52%, calc(100% - 16px) 52%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
input[type=text]:focus, input[type=email]:focus, select:focus { border-color: var(--teal-dark); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
input.bad { border-color: var(--danger); }
select:disabled, input:disabled { opacity: 0.5; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--teal-dark); flex: none; }

.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface); cursor: pointer; width: 100%; }
.opt:hover { border-color: var(--teal); }
.opt[aria-checked="true"] { border-color: var(--teal-dark); background: var(--teal-soft); }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin-top: 3px; display: grid; place-items: center; }
.opt[aria-checked="true"] .dot { border-color: var(--teal-dark); }
.opt[aria-checked="true"] .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--teal-dark); }
.opt small { display: block; color: var(--muted); font-size: 0.82rem; }

/* Buscador de centros */
.ta { position: relative; }
.sug { list-style: none; margin: 6px 0 0; padding: 4px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: 360px; overflow-y: auto; }
.sug li { padding: 9px 12px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.sug li[aria-selected="true"], .sug li:hover { background: var(--teal-soft); }
.sug .nm { font-weight: 700; }
.sug .meta { font-size: 0.82rem; color: var(--muted); }
.sug .none { border-top: 1px solid var(--line); margin-top: 4px; border-radius: 0 0 6px 6px; color: var(--teal-dark); font-weight: 700; }
.sug .empty { cursor: default; color: var(--muted); font-size: 0.9rem; }
.chosen { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1.5px solid var(--teal-dark); background: var(--teal-soft); border-radius: var(--r); padding: 12px 16px; flex-wrap: wrap; }
.chosen .nm { font-weight: 700; color: var(--teal-dark); }
.chosen .meta { font-size: 0.85rem; color: var(--muted); }
.chosen.pending { border-color: var(--c5); background: #FDECEA; }
.chosen.pending .nm { color: var(--c5-ink); }

/* Hero */
.hero { background: var(--teal-dark); color: #FFFFFF; border-radius: var(--r); padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.hero .eyebrow { color: #BFEDE7; }
.hero .lede { color: #E4F4F2; }
.hero-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; max-width: 360px; }
.hero-tiles span { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; max-width: 100%; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 0.95rem; color: var(--muted); }
.facts b { color: var(--ink); }

/* Dimensión */
.dimband { border-radius: var(--r); padding: 22px 22px 20px; display: flex; gap: 18px; align-items: center; }
.dimband > div:last-child { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.dimband .eyebrow { color: inherit; opacity: 0.85; }
.dimband h2 { color: var(--ink); }
.dimband .ico { flex: none; width: 74px; height: 74px; border-radius: 14px; background: rgba(255,255,255,0.55); display: grid; place-items: center; }
@media (max-width: 440px) { .dimband .ico { width: 58px; height: 58px; } .dimband .led5 { --px: 7px !important; } }

/* Escala Likert */
.item { display: flex; flex-direction: column; gap: 12px; padding-block: 18px; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; padding-top: 4px; }
.item .q { display: flex; gap: 12px; }
.item .n { font-weight: 700; color: var(--teal-dark); min-width: 2ch; }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lk { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.lk:hover { border-color: var(--teal); }
.lk .leds { display: flex; gap: 3px; color: var(--teal-dark); }
.lk .leds i { width: 6px; height: 6px; border-radius: 1.5px; background: currentColor; opacity: 0.18; display: block; }
.lk .leds i.on { opacity: 1; }
.lk .v { font-weight: 700; font-size: 1.1rem; line-height: 1; }
.lk .t { font-size: 0.78rem; color: var(--muted); line-height: 1.1; text-align: center; }
.lk[aria-checked="true"] { border-color: var(--teal-dark); background: var(--teal-dark); color: #FFFFFF; }
.lk[aria-checked="true"] .t { color: #FFFFFF; font-weight: 700; }
.lk[aria-checked="true"] .leds { color: #FFFFFF; }
.scale-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.86rem; color: var(--muted); }
.scale-key b { color: var(--ink); }

/* Revisión */
.rev { display: flex; flex-direction: column; gap: 0; }
.rev-sec { display: flex; flex-direction: column; gap: 8px; padding-block: 16px; border-top: 1px solid var(--line); }
.rev-sec:first-child { border-top: 0; padding-top: 0; }
.rev-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.kv { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 4px 14px; font-size: 0.94rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 480px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }

/* Perfil */
.levels-key { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border-radius: 25px; padding: 4px 12px 4px 10px; font-size: 0.84rem; font-weight: 700; white-space: nowrap; border: 1.5px solid var(--teal-dark); color: var(--teal-dark); background: var(--surface); }
.chip .lv { display: inline-flex; gap: 3px; }
.chip .lv i { width: 8px; height: 8px; border-radius: 2px; background: var(--teal-dark); opacity: 0.2; display: block; }
.chip .lv i.on { opacity: 1; }
.chip.c { background: var(--teal-dark); color: #FFFFFF; }
.chip.c .lv i { background: #FFFFFF; }
.next { border-radius: var(--r); padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; background: var(--teal-soft); border: 2px solid var(--teal-dark); }
.dim { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.dim-top { display: flex; align-items: center; gap: 14px; padding: 14px 20px; }
.dim-top h3 { min-width: 0; flex: 1; }
.dim-top .ico { flex: none; width: 46px; height: 46px; border-radius: 10px; background: rgba(255,255,255,0.55); display: grid; place-items: center; }
.dim-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.dim-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.meter { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
.meter-bar { position: relative; height: 10px; border-radius: 5px; display: grid; grid-template-columns: 1.5fr 1.3fr 1.2fr; gap: 2px; }
.meter-bar span { display: block; height: 100%; background: #E9EEF0; }
.meter-bar span:nth-child(1) { border-radius: 5px 0 0 5px; }
.meter-bar span:nth-child(2) { background: #D6EAE7; }
.meter-bar span:nth-child(3) { background: #B5DDD7; border-radius: 0 5px 5px 0; }
.meter-bar b { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid var(--surface); background: var(--teal-dark); box-shadow: 0 0 0 1px var(--teal-dark); }
.meter-lbl { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter-lbl strong { color: var(--ink); }
.observa { font-size: 0.92rem; color: var(--muted); }
.rec { background: var(--bg); border-radius: 8px; padding: 12px 14px; }
.rec b { display: block; color: var(--teal-dark); }
.cierre { display: flex; flex-direction: column; gap: 10px; padding: 24px 22px; border-radius: var(--r); background: var(--purple); color: #FFFFFF; }
.cierre h3 { font-size: 1.3rem; }
details.team { border: 1.5px dashed #B9C2CC; border-radius: var(--r); padding: 14px 18px; background: var(--surface); }
details.team summary { cursor: pointer; font-weight: 700; }
details.team .tbl { overflow-x: auto; margin-top: 12px; }
details.team table { border-collapse: collapse; font-size: 0.82rem; width: 100%; }
details.team td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
details.team td:first-child { font-family: var(--font-mono); color: var(--muted); white-space: nowrap; }
.saving { display: flex; align-items: center; gap: 14px; color: var(--muted); padding-block: 40px; justify-content: center; }
.saving .prog-leds i { animation: blink 0.9s infinite; }
.saving .prog-leds i:nth-child(2) { animation-delay: 0.15s; } .saving .prog-leds i:nth-child(3) { animation-delay: 0.3s; } .saving .prog-leds i:nth-child(4) { animation-delay: 0.45s; } .saving .prog-leds i:nth-child(5) { animation-delay: 0.6s; }
@keyframes blink { 0%, 100% { background: var(--line); } 50% { background: var(--teal-dark); } }
@media (prefers-reduced-motion: reduce) { .saving .prog-leds i { animation: none; background: var(--teal-dark); } }
footer { background: var(--surface); border-top: 1px solid var(--line); text-align: center; font-size: 0.82rem; color: var(--muted); padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
</style>

<div class="proto">Prototipo navegable · catálogo de centros SINTÉTICO · las respuestas no se guardan</div>

</div></header>
<main><div class="wrap" id="app"></div></main>

function sugerirEmail(v) {
  const m = String(v || "").trim().toLowerCase().match(/^([^\s@]+)@([^\s@]+)$/); if (!m) return null;
  const dom = m[2]; if (DOMINIOS.includes(dom)) return null;
  let best = null, bd = 3;

  return best ? m[1] + "@" + best : null;
}
function lev(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function cedulaDigits(v) { return String(v || "").replace(/\D/g, ""); }
function cedulaValida(v) {
  const d = cedulaDigits(v);

  const base = d.slice(0, -1).padStart(7, "0"), dv = +d.slice(-1), w = [2, 9, 8, 7, 6, 3, 4];
  const s = [...base].reduce((a, c, i) => a + (+c) * w[i], 0);
  return (10 - (s % 10)) % 10 === dv;
}

function bigrams(s) { const b = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); b.set(g, (b.get(g) || 0) + 1); } return b; }
function dice(a, b) {
  if (!a || !b) return 0; if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0;
  const A = bigrams(a), B = bigrams(b); let inter = 0;
  for (const [g, n] of A) inter += Math.min(n, B.get(g) || 0);
  return (2 * inter) / (a.length - 1 + b.length - 1);
}
function simTexto(resto, c) {
  if (!resto) return 0;
  const hay = c.nn + " " + c.ln;
  if (hay.includes(resto)) return 1;
  const rt = resto.split(" "), ht = hay.split(" ");
  let tot = 0;
  for (const t of rt) { let best = 0; for (const h of ht) best = Math.max(best, dice(t, h)); tot += best; }
  return tot / rt.length;
}
function buscar(q) {
  const cand = candidatos();
  const nq = norm(q).replace(/\b(nro|n|no)\b/g, " ").replace(/\s+/g, " ").trim();
  if (!nq) return cand.slice().sort(ordenBase).slice(0, 12).map(c => ({ c, s: 0 }));
  const toks = nq.split(" ");
  const tiposQ = toks.filter(t => TIPOS[t]).map(t => TIPOS[t]);
  const tipo = ["anexo", "utu", "ifd", "cerp", "lic", "jar", "esc"].find(t => tiposQ.includes(t)) || null;
  const numTok = toks.find(t => /^\d+$/.test(t)); const num = numTok ? +numTok : null;
  const resto = toks.filter(t => !TIPOS[t] && !/^\d+$/.test(t)).join(" ");
  const out = [];
  for (const c of cand) {
    let s = 0;
    if (num !== null) {
      if (c.num === num) s += 60;
      else if (String(c.cod) === numTok) s += 80;
      else continue;
    }
    if (resto) {
      const t = simTexto(resto, c);
      if (num === null && t < 0.55) continue;
      s += t * 40;
    }
    if (tipo) {
      const grupo = (tipo === "esc" || tipo === "jar") ? ["esc", "jar"] : [tipo];
      if (grupo.includes(c.tipo)) s += 15; else if (num === null && !resto) continue; else s -= 10;
    } else if (c.tipo === "anexo") s -= 8;
    if (!AULA.has(c.tipo) && c.tipo !== "anexo") s -= 6;
    out.push({ c, s });
  }
  return out.sort((a, b) => b.s - a.s || ordenBase(a.c, b.c)).slice(0, 8);
}
function ordenBase(a, b) {
  const ra = AULA.has(a.tipo) ? 0 : a.tipo === "anexo" ? 1 : 2, rb = AULA.has(b.tipo) ? 0 : b.tipo === "anexo" ? 1 : 2;
  return ra - rb || (a.num ?? 9999) - (b.num ?? 9999) || a.nm.localeCompare(b.nm, "es");
}

function go(n) { S.step = n; render(); window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); const h = $("#app h2, #app h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }

/* ---------- Pantallas ---------- */
function render() {
  renderProg();
  const k = STEPS[S.step], app = $("#app");
  if (k === "inicio") return vInicio(app);
  if (k === "datos") return vDatos(app);
  if (k === "experiencia") return vExperiencia(app);
  if (k.startsWith("d")) return vDim(app, +k.slice(1));
  if (k === "revision") return vRevision(app);
  if (k === "perfil") return vPerfil(app);
}

function datosValidos() {
  const e = {};
  if (norm(S.nombre).split(" ").filter(Boolean).length < 2) e.nombre = "Escribí tu nombre y apellido.";
  if (!emailValido(S.email)) e.email = S.email.trim() ? "Revisá el correo: falta algo o tiene un carácter de más." : "Escribí tu correo electrónico.";
  if (!cedulaValida(S.cedula)) e.cedula = cedulaDigits(S.cedula).length < 7 ? "Escribí tu cédula completa, con el dígito verificador." : "El dígito verificador no coincide. Revisá los números.";
  if (!S.sub) e.sub = "Elegí tu subsistema.";
  if (!S.dep) e.dep = "Elegí tu departamento.";
  if (S.dep && S.dep !== MVD && !S.loc) e.loc = "Elegí tu localidad.";
  if (!S.centro && !(S.origen === "pendiente de revisión" && norm(S.centroTexto).length >= 3)) e.centro = "Buscá y elegí tu centro educativo.";
  return e;
}

    const inp = $("#cq"), ul = $("#sug"); let act = -1, res = [];

      const q = inp.value; res = buscar(q);
      let h = res.map((r, i) => `<li role="option" id="o${i}" data-i="${i}" aria-selected="${i === act}"><span class="nm">${esc(centroLabel(r.c))}</span><span class="meta">${esc(r.c.loc)} · Código <span class="mono">${r.c.cod}</span></span></li>`).join("");
      if (!res.length && q.trim()) h = `<li class="empty" aria-disabled="true">No encontramos coincidencias en ${esc(S.dep === MVD ? MVD : S.loc)}. Probá con el número o con otra palabra del nombre.</li>`;
      if (norm(q).length >= 3) h += `<li role="option" class="none" id="o${res.length}" data-none="1" aria-selected="${act === res.length}">No encuentro mi centro: registrar «${esc(q.trim())}»</li>`;
      ul.innerHTML = h; ul.hidden = !h;
      inp.setAttribute("aria-activedescendant", act >= 0 ? "o" + act : "");
    };
    const pick = i => {
      if (i === res.length) { S.centro = null; S.centroTexto = inp.value.trim(); S.origen = "pendiente de revisión"; }
      else { S.centro = res[i].c; S.centroTexto = inp.value.trim() || centroLabel(res[i].c); S.origen = "elegido por docente"; }
      S.touched.centro = true; renderCentro(); upd();
    };
    inp.oninput = () => { act = -1; draw(); };
    inp.onkeydown = e => {
      const max = res.length + (norm(inp.value).length >= 3 ? 1 : 0) - 1;
      if (e.key === "ArrowDown") { act = Math.min(max, act + 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); draw(); e.preventDefault(); }
      else if (e.key === "Enter" && act >= 0) { pick(act); e.preventDefault(); }
    };
    ul.onmousedown = e => e.preventDefault();
    ul.onclick = e => { const li = e.target.closest("li[role=option]"); if (li) pick(li.dataset.none ? res.length : +li.dataset.i); };

function filaGuardada(res) {
  const c = S.centro, f = S.fecha || new Date();
  const p = n => String(n).padStart(2, "0");
  const rows = [
    ["fecha_hora", `${f.getFullYear()}-${p(f.getMonth() + 1)}-${p(f.getDate())} ${p(f.getHours())}:${p(f.getMinutes())}`],
    ["version_instrumento", VERSION], ["nombre", S.nombre], ["cedula", cedulaDigits(S.cedula)], ["email", S.email.trim().toLowerCase()],
    ["subsistema", S.sub], ["departamento", S.dep], ["localidad", S.dep === MVD ? "(no se pide)" : S.loc],
    ["centro_texto", S.centroTexto], ["centro_codigo", c ? c.cod : ""], ["origen_macheo", S.origen],
    ...CTX.map((q, i) => [`ctx_${i + 1}`, `${S.ctx[i] + 1} · ${q.o[S.ctx[i]]}`]),
    ...S.r.map((v, k) => [`d${Math.floor(k / 3) + 1}_i${k % 3 + 1}`, v]),
    ...res.map(r => [`d${r.i + 1}_suma`, r.suma]), ...res.map(r => [`d${r.i + 1}_nivel`, LVL[r.lvl]]),
  ];
  return `<details class="team"><summary>Para el equipo del programa: así se guardaría esta respuesta</summary>
    <p class="note" style="margin-top:10px">Una fila en la pestaña Respuestas de la Sheet (${rows.length} columnas). El docente no ve esta sección en la versión final.</p>
    <div class="tbl"><table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table></div></details>`;
}
