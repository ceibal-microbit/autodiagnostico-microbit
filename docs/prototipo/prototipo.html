<style>
/* Formulario simple, al estilo Google Forms, con la paleta de Ceibal. Una columna de tarjetas blancas, controles nativos. */
:root {
  color-scheme: light;
  --bg: #F9FAFB;
  --surface: #FFFFFF;
  --ink: #111111;
  --muted: #4B5563;
  --line: #E5E7EB;
  --teal-dark: #00635D;      /* verde Ceibal: franja superior y botones */
  --teal: #00A096;           /* acentos */
  --teal-soft: #E3F3F1;
  --mb-green: #026902;       /* verde micro:bit */
  --c1: #7BCDC1; --c1-ink: #0E5F55;   /* aqua */
  --c2: #D17EB2; --c2-ink: #6E2357;   /* rosa */
  --c3: #F2E616; --c3-ink: #6B5F00;   /* amarillo */
  --c4: #27B2D9; --c4-ink: #0B4F66;   /* celeste */
  --c5: #E6665D; --c5-ink: #7A1E17;   /* coral */
  --purple: #5A2382;
  --danger: #B42318;
  --font-display: "Ceibal Mozaic", "Figtree", Verdana, sans-serif;
  --font-body: "Ceibal Mozaic", "Figtree", Verdana, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; font-weight: 600; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--teal-dark); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

.proto { background: var(--purple); color: #FFFFFF; font-size: 0.82rem; font-weight: 600; text-align: center; padding: 7px 16px; }
.proto button { background: none; border: 0; padding: 0; color: #FFFFFF; font-weight: 700; text-decoration: underline; cursor: pointer; }
.topband { background: var(--teal-dark); color: #FFFFFF; padding: 10px 16px; font-weight: 600; font-size: 0.92rem; }
.topband-in { max-width: 720px; margin: 0 auto; }
main { padding: 16px 12px 48px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.note { font-size: 0.9rem; color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal-dark); font-weight: 700; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 60ch; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Tarjetas del formulario */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; }
.card.titulo { border-top: 10px solid var(--teal-dark); }
.card.titulo h1 { color: var(--teal-dark); }
.card.seccion { border-top: 6px solid var(--teal); }
.req { color: var(--danger); }
.q-t { font-weight: 600; display: block; }
.card.bad { border-color: var(--danger); }
.grupo .card { padding: 16px 18px; }
@media (max-width: 480px) { .grupo { padding: 16px 10px; } .grupo > h2, .grupo > p { padding: 0 6px; } .grupo .card { padding: 14px 10px; } }
.help { font-size: 0.86rem; color: var(--muted); }
.err { font-size: 0.86rem; color: var(--danger); }
.err:empty, .help:empty, #sug-email:empty, #f-loc:empty, #f-centro:empty { display: none; }

/* Controles nativos */
input[type=text], input[type=email] { width: 100%; max-width: 480px; padding: 6px 0; border: 0; border-bottom: 1px solid #9CA3AF; border-radius: 0; background: transparent; }
input[type=text]:focus, input[type=email]:focus { outline: none; border-bottom: 2px solid var(--teal-dark); padding-bottom: 5px; }
input:disabled { color: var(--muted); }
select { width: 100%; max-width: 480px; padding: 9px 10px; border: 1px solid #9CA3AF; border-radius: 4px; background: var(--surface); }
select:disabled { color: var(--muted); background: var(--bg); }
.op { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
.op input { width: 18px; height: 18px; margin: 3px 0 0; flex: none; accent-color: var(--teal-dark); }
.ops { display: flex; flex-direction: column; }

/* Escala de 1 a 5 */
.escala { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.esc-op { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; cursor: pointer; text-align: center; font-size: 0.84rem; line-height: 1.2; }
.esc-op b { font-weight: 600; font-size: 0.95rem; }
.esc-op input { width: 18px; height: 18px; margin: 0; accent-color: var(--teal-dark); }

/* Buscador de centros */
.sug { list-style: none; margin: 0; padding: 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); max-height: min(280px, 35vh); overflow-y: auto; }
.sug[hidden] { display: none; }
.sug li { padding: 8px 10px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; }
.sug li[aria-selected="true"], .sug li:hover { background: var(--teal-soft); }
.sug .meta { font-size: 0.82rem; color: var(--muted); }
.sug .none { border-top: 1px solid var(--line); border-radius: 0; color: var(--teal-dark); font-weight: 600; }
.sug .empty { cursor: default; color: var(--muted); font-size: 0.9rem; }
.sug .empty:hover { background: none; }
.elegido .nm { font-weight: 600; }
.elegido .meta { font-size: 0.86rem; color: var(--muted); }
.lnk { background: none; border: 0; padding: 0; color: var(--teal-dark); text-decoration: underline; cursor: pointer; font-size: 0.92rem; text-align: left; }

/* Botones del formulario */
.pie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.pie .pag { margin-left: auto; font-size: 0.86rem; color: var(--muted); }
.fbtn { border: 1px solid var(--teal-dark); border-radius: 4px; padding: 8px 22px; font-weight: 600; font-size: 15px; cursor: pointer; background: var(--teal-dark); color: #FFFFFF; }
.fbtn.sec { background: var(--surface); color: var(--teal-dark); }
.aviso { font-size: 0.9rem; color: var(--danger); width: 100%; }
.aviso:empty { display: none; }
.guardando { color: var(--muted); padding: 40px 0; text-align: center; }

/* Celular primero: toda zona tocable mide al menos 44 px; los campos usan 16 px para que el iPhone no haga zoom. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, label, select, input, .sug li { touch-action: manipulation; }
input[type=text], input[type=email] { min-height: 44px; }
select { min-height: 44px; }
.op { padding: 10px 0; }
.esc-op { min-height: 64px; justify-content: center; }
.sug li { min-height: 44px; justify-content: center; }
.lnk { min-height: 44px; display: inline-flex; align-items: center; }
.fbtn { min-height: 46px; }
@media (max-width: 480px) { h1 { font-size: 1.5rem; } .card { padding: 16px; } .fbtn { flex: 1 1 auto; } .pie .pag { width: 100%; margin: 0; text-align: center; order: 3; } .aviso { order: 4; text-align: center; } }
@media (max-width: 360px) { main { padding-left: 8px; padding-right: 8px; } .grupo { padding: 14px 6px; } .grupo .card { padding: 14px 8px; } .escala { gap: 2px; } .esc-op { font-size: 0.78rem; } }

/* Radar del perfil */
.radar { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.radar svg { display: block; width: 100%; max-width: 360px; margin: 0 auto; }
.radar figcaption { text-align: center; }
.r-anillo { fill: none; stroke: var(--line); stroke-width: 1; }
.r-eje { stroke: var(--line); stroke-width: 1; }
.r-forma { fill: var(--teal); fill-opacity: 0.18; stroke: var(--teal-dark); stroke-width: 2; stroke-linejoin: round; }
.r-toque { fill: transparent; }
.r-marca { stroke: var(--teal-dark); stroke-width: 1.5; }
.r-num { font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.radar-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.radar-lista li { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.r-color { width: 12px; height: 12px; border-radius: 3px; flex: none; margin-top: 6px; }
.r-nombre { flex: 1; min-width: 0; }
.r-valor { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Referencia de niveles */
.niveles { border-collapse: collapse; width: 100%; max-width: 360px; background: var(--surface); font-size: 0.92rem; }
.niveles th, .niveles td { text-align: left; padding: 7px 12px; border: 1px solid var(--line); }
.niveles th { font-weight: 600; color: var(--muted); }

/* Perfil */
.btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--teal-dark); border-radius: 25px; padding: 11px 24px; font-weight: 700; cursor: pointer; background: var(--teal-dark); color: #FFFFFF; }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--mb-green); }
/* LEDs 5×5 */
.led5 { display: grid; grid-template-columns: repeat(5, var(--px, 8px)); gap: calc(var(--px, 8px) * 0.35); }
.led5 i { width: var(--px, 8px); height: var(--px, 8px); border-radius: 22%; background: currentColor; opacity: 0.18; display: block; }
.led5 i.on { opacity: 1; }
/* Perfil */
.chip { display: inline-flex; align-items: center; gap: 7px; border-radius: 25px; padding: 4px 12px 4px 10px; font-size: 0.84rem; font-weight: 700; white-space: nowrap; border: 1.5px solid var(--teal-dark); color: var(--teal-dark); background: var(--surface); }
.chip .lv { display: inline-flex; gap: 3px; }
.chip .lv i { width: 8px; height: 8px; border-radius: 2px; background: var(--teal-dark); opacity: 0.2; display: block; }
.chip .lv i.on { opacity: 1; }
.dim { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.dim-top { display: flex; align-items: center; gap: 14px; padding: 14px 20px; }
.dim-top h3 { min-width: 0; flex: 1; }
.dim-top .ico { flex: none; width: 46px; height: 46px; border-radius: 10px; background: rgba(255,255,255,0.55); display: grid; place-items: center; }
.dim-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.dim-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.observa { font-size: 0.92rem; color: var(--muted); }
.rec { background: var(--bg); border-radius: 8px; padding: 12px 14px; }
.rec b { display: block; color: var(--teal-dark); }
.cierre { display: flex; flex-direction: column; gap: 10px; padding: 24px 22px; border-radius: var(--r); background: var(--purple); color: #FFFFFF; }
.cierre h3 { font-size: 1.3rem; }
details.team { border: 1.5px dashed #B9C2CC; border-radius: var(--r); padding: 14px 18px; background: var(--surface); }
details.team summary { cursor: pointer; font-weight: 700; }
details.team .tbl { overflow-x: auto; margin-top: 12px; }
details.team table { border-collapse: collapse; font-size: 0.82rem; width: 100%; }
details.team td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
details.team td:first-child { font-family: var(--font-mono); color: var(--muted); white-space: nowrap; }
footer { text-align: center; font-size: 0.82rem; color: var(--muted); padding: 0 16px 28px; }
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[º°]/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

function emailValido(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v || "").trim()); }
const DOMINIOS = ["gmail.com", "hotmail.com", "outlook.com", "yahoo.com", "ceibal.edu.uy", "anep.edu.uy", "adinet.com.uy", "vera.com.uy", "live.com", "icloud.com"];
function sugerirEmail(v) {
  const m = String(v || "").trim().toLowerCase().match(/^([^\s@]+)@([^\s@]+)$/); if (!m) return null;
  const dom = m[2]; if (DOMINIOS.includes(dom)) return null;
  let best = null, bd = 3;
  for (const d of DOMINIOS) { const k = lev(dom, d); if (k > 0 && k < bd) { bd = k; best = d; } }
  return best ? m[1] + "@" + best : null;
}
function lev(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function cedulaDigits(v) { return String(v || "").replace(/\D/g, ""); }
function cedulaValida(v) {
  const d = cedulaDigits(v);
  if (d.length < 7 || d.length > 8) return false;
  const base = d.slice(0, -1).padStart(7, "0"), dv = +d.slice(-1), w = [2, 9, 8, 7, 6, 3, 4];
  const s = [...base].reduce((a, c, i) => a + (+c) * w[i], 0);
  return (10 - (s % 10)) % 10 === dv;
}
function cedulaFmt(v) {
  const d = cedulaDigits(v); if (d.length < 2) return d;
  const base = d.slice(0, -1), dv = d.slice(-1);
  return base.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
}

const CENTROS = CAT.c.map(([cod, nm, rub, di, loc, tipo, num]) => ({ cod, nm, rub, dep: CAT.deps[di], loc, tipo, num, nn: norm(nm).replace(/\b\d{6,}\b/g, "").trim(), ln: norm(loc) }));

const FUERA_DE_URUGUAY = new Set(["Asunción", "Rio Grande do Sul"]);
const DEPTOS = [...new Set(CENTROS.map(c => c.dep))].filter(d => !FUERA_DE_URUGUAY.has(d)).sort((a, b) => a.localeCompare(b, "es"));
function localidades(sub, dep) {
  return [...new Set(CENTROS.filter(c => c.rub === sub && c.dep === dep).map(c => c.loc))].sort((a, b) => a.localeCompare(b, "es"));
}
function candidatos() {
  return CENTROS.filter(c => c.rub === S.sub && c.dep === S.dep && (S.dep === MVD || c.loc === S.loc));
}
const TIPOS = { escuela: "esc", esc: "esc", jardin: "jar", jn: "jar", jardines: "jar", liceo: "lic", lic: "lic", utu: "utu", tecnica: "utu", ifd: "ifd", cerp: "cerp", anexo: "anexo", satelite: "anexo" };
const AULA = new Set(["esc", "jar", "lic", "utu", "ifd", "cerp"]);
function bigrams(s) { const b = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); b.set(g, (b.get(g) || 0) + 1); } return b; }
function dice(a, b) {
  if (!a || !b) return 0; if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0;
  const A = bigrams(a), B = bigrams(b); let inter = 0;
  for (const [g, n] of A) inter += Math.min(n, B.get(g) || 0);
  return (2 * inter) / (a.length - 1 + b.length - 1);
}
function simTexto(resto, c) {
  if (!resto) return 0;
  const hay = c.nn + " " + c.ln;
  if (hay.includes(resto)) return 1;
  const rt = resto.split(" "), ht = hay.split(" ");
  let tot = 0;
  for (const t of rt) { let best = 0; for (const h of ht) best = Math.max(best, dice(t, h)); tot += best; }
  return tot / rt.length;
}
function buscar(q) {
  const cand = candidatos();
  const nq = norm(q).replace(/\b(nro|n|no)\b/g, " ").replace(/\s+/g, " ").trim();
  if (!nq) return cand.slice().sort(ordenBase).slice(0, 12).map(c => ({ c, s: 0 }));
  const toks = nq.split(" ");
  const tiposQ = toks.filter(t => TIPOS[t]).map(t => TIPOS[t]);
  const tipo = ["anexo", "utu", "ifd", "cerp", "lic", "jar", "esc"].find(t => tiposQ.includes(t)) || null;
  const numTok = toks.find(t => /^\d+$/.test(t)); const num = numTok ? +numTok : null;
  const resto = toks.filter(t => !TIPOS[t] && !/^\d+$/.test(t)).join(" ");
  const out = [];
  for (const c of cand) {
    let s = 0;
    if (num !== null) {
      if (c.num === num) s += 60;
      else if (String(c.cod) === numTok) s += 80;
      else continue;
    }
    if (resto) {
      const t = simTexto(resto, c);
      if (num === null && t < 0.55) continue;
      s += t * 40;
    }
    if (tipo) {
      const grupo = (tipo === "esc" || tipo === "jar") ? ["esc", "jar"] : [tipo];
      if (grupo.includes(c.tipo)) s += 15; else if (num === null && !resto) continue; else s -= 10;
    } else if (c.tipo === "anexo") s -= 8;
    if (!AULA.has(c.tipo) && c.tipo !== "anexo") s -= 6;
    out.push({ c, s });
  }
  return out.sort((a, b) => b.s - a.s || ordenBase(a.c, b.c)).slice(0, 8);
}
function ordenBase(a, b) {
  const ra = AULA.has(a.tipo) ? 0 : a.tipo === "anexo" ? 1 : 2, rb = AULA.has(b.tipo) ? 0 : b.tipo === "anexo" ? 1 : 2;
  return ra - rb || (a.num ?? 9999) - (b.num ?? 9999) || a.nm.localeCompare(b.nm, "es");
}
const centroLabel = c => {
  const l = c.nm.replace(/\s*-\s*\d{6,}\s*$/, "");
  if (c.num && !/\d/.test(l) && (c.tipo === "esc" || c.tipo === "jar")) return `${c.tipo === "jar" ? "Jardín" : "Escuela"} Nº ${c.num} · ${l}`;
  return l;
};

      return;
    }
    f.innerHTML = pregunta("centro", "Centro educativo", `<input type="text" id="cq" role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list" autocomplete="off" placeholder="Tu respuesta" value="${esc(textoInicial)}">
      <ul class="sug" id="sug" role="listbox" hidden></ul>`, "Escribí el número o el nombre, por ejemplo: escuela 45. Si no aparece, vas a poder registrarlo igual.", "cq");
    const inp = $("#cq"), ul = $("#sug"); let act = -1, res = [];
    const verLista = v => { ul.hidden = !v; inp.setAttribute("aria-expanded", String(v)); };
    const draw = () => {
      const q = inp.value; res = buscar(q);
      let h = res.map((r, i) => `<li role="option" id="o${i}" data-i="${i}" aria-selected="${i === act}"><span>${esc(centroLabel(r.c))}</span><span class="meta">${esc(r.c.loc)}</span></li>`).join("");
      if (!res.length && q.trim()) h = `<li class="empty" aria-disabled="true">No encontramos coincidencias en ${esc(S.dep === MVD ? MVD : S.loc)}. Probá con el número o con otra palabra del nombre.</li>`;
      if (norm(q).length >= 3) h += `<li role="option" class="none" id="o${res.length}" data-none="1" aria-selected="${act === res.length}">No encuentro mi centro: registrar «${esc(q.trim())}»</li>`;
      ul.innerHTML = h;
      verLista(!!h && document.activeElement === inp);
      inp.setAttribute("aria-activedescendant", act >= 0 ? "o" + act : "");
    };
    const pick = i => {
      if (i === res.length) { S.centro = null; S.centroTexto = inp.value.trim(); S.origen = "pendiente de revisión"; }
      else { S.centro = res[i].c; S.centroTexto = inp.value.trim() || centroLabel(res[i].c); S.origen = "elegido por docente"; }
      S.touched.centro = true; pintarCentro(); pintar();
    };
    inp.onfocus = () => { draw(); if (window.innerWidth < 600) setTimeout(() => inp.closest(".card").scrollIntoView({ block: "start" }), 300); };
    inp.onblur = () => verLista(false);
    inp.oninput = () => { act = -1; draw(); };
    inp.onkeydown = e => {
      const max = res.length + (norm(inp.value).length >= 3 ? 1 : 0) - 1;
      if (e.key === "ArrowDown") { act = Math.min(max, act + 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); draw(); e.preventDefault(); }
      else if (e.key === "Enter" && act >= 0) { pick(act); e.preventDefault(); }
      else if (e.key === "Escape") verLista(false);
    };
    ul.onmousedown = e => e.preventDefault();
    ul.onclick = e => { const li = e.target.closest("li[role=option]"); if (li) pick(li.dataset.none ? res.length : +li.dataset.i); };
  }
  pintarLocalidad(); pintarCentro(S.centroTexto); pintar();
  $("#next").onclick = () => intentarSeguir(erroresDatos(), CLAVES_DATOS, () => go(1));
}

function vExperiencia(app) {
  const claves = CTX.map((_, i) => "ctx" + i);
  const errores = () => Object.fromEntries(claves.filter((_, i) => S.ctx[i] === null).map(k => [k, OBLIGATORIA]));
  app.innerHTML = titulo(false) + seccion("Tu experiencia", "Estas preguntas nos ayudan a comprender tu trayectoria. No forman parte del puntaje del autodiagnóstico.",
    CTX.map((c, qi) => pregunta("ctx" + qi, `${qi + 1}. ${c.q}`, `<div class="ops" role="radiogroup" aria-labelledby="t-ctx${qi}">${c.o.map((o, oi) => `<label class="op"><input type="radio" name="ctx${qi}" value="${oi}" ${S.ctx[qi] === oi ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`)).join("")) +
    pie(true, "Siguiente");
  app.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => {
    const qi = +r.name.slice(3); S.ctx[qi] = +r.value; pintarErrores(errores(), claves);
    if (!Object.keys(errores()).length) $("#aviso").textContent = "";
  });
  pintarErrores(errores(), claves);
  $("#back").onclick = () => go(0);
  $("#next").onclick = () => intentarSeguir(errores(), claves, () => go(2));
}

function vAfirmaciones(app) {
  const claves = S.r.map((_, k) => "r" + k);
  const errores = () => Object.fromEntries(claves.filter((_, k) => S.r[k] === null).map(k => [k, OBLIGATORIA]));
  app.innerHTML = titulo(false, "Ahora sí: ¿cómo es tu vínculo actual con la placa micro:bit? Para cada afirmación, indicá cuánto te representa actualmente.") +
    DIMS.map((d, di) => seccion(`${di + 1}. ${d.nm}`, "", `<p class="observa"><b>Qué observa:</b> ${esc(d.observa)}</p>` + d.items.map((it, j) => {
      const k = di * 3 + j;
      return pregunta("r" + k, `${k + 1}. ${it}`, `<div class="escala" role="radiogroup" aria-labelledby="t-r${k}">${SCALE.map((s, v) => `<label class="esc-op"><b>${v + 1}</b><span>${s}</span><input type="radio" name="r${k}" value="${v + 1}" ${S.r[k] === v + 1 ? "checked" : ""}></label>`).join("")}</div>`);
    }).join(""), `var(--c${di + 1})`)).join("") +
    pie(true, "Enviar");
  app.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => {
    S.r[+r.name.slice(1)] = +r.value; pintarErrores(errores(), claves);
    if (!Object.keys(errores()).length) $("#aviso").textContent = "";
  });
  pintarErrores(errores(), claves);
  $("#back").onclick = () => go(1);
  $("#next").onclick = () => intentarSeguir(errores(), claves, () => {
    S.fecha = new Date();
    app.innerHTML = '<div class="guardando" role="status">Guardando tus respuestas…</div>';
    setTimeout(() => go(PERFIL), 900);
  });
}

/* Radar del perfil: una sola forma, del centro (1) al borde (5). El número identifica cada dimensión y la lista de abajo da los valores. */
function radar(res) {
  const cx = 160, cy = 152, R = 112;
  const punto = (i, radio) => { const a = (-90 + i * 72) * Math.PI / 180; return [cx + radio * Math.cos(a), cy + radio * Math.sin(a)]; };
  const aRadio = v => (v - 1) / 4 * R;
  const num = n => n.toFixed(1);
  const forma = valores => valores.map((v, i) => punto(i, aRadio(v)).map(num).join(",")).join(" ");
  const anillos = [2, 3, 4, 5].map(v => `<polygon class="r-anillo" points="${forma([v, v, v, v, v])}"/>`).join("");
  const ejes = res.map(r => { const [x, y] = punto(r.i, R); return `<line class="r-eje" x1="${cx}" y1="${cy}" x2="${num(x)}" y2="${num(y)}"/>`; }).join("");
  const marcas = res.map(r => {
    const [x, y] = punto(r.i, aRadio(r.prom));
    const [lx, ly] = punto(r.i, R + 17);
    const detalle = `${r.i + 1}. ${r.d.nm}: promedio ${fmt1(r.prom)}, ${LVL[r.lvl]}`;
    return `<g><title>${esc(detalle)}</title><circle class="r-toque" cx="${num(x)}" cy="${num(y)}" r="18"/><circle class="r-marca" cx="${num(x)}" cy="${num(y)}" r="6" style="fill:var(--c${r.i + 1})"/></g>
      <text class="r-num" x="${num(lx)}" y="${num(ly)}">${r.i + 1}</text>`;
  }).join("");
  const lista = res.map(r => `<li><span class="r-color" style="background:var(--c${r.i + 1})"></span><span class="r-nombre">${r.i + 1}. ${esc(r.d.nm)}</span><span class="r-valor">${fmt1(r.prom)}</span></li>`).join("");
  return `<figure class="radar">
    <svg viewBox="0 0 320 300" role="img" aria-label="Gráfico de radar con tu promedio en las cinco dimensiones. Los valores están en la lista de abajo.">${anillos}${ejes}<polygon class="r-forma" points="${forma(res.map(r => r.prom))}"/>${marcas}</svg>
    <figcaption class="note">Del centro (1) al borde (5): cuanto más lejos del centro, más alto el promedio.</figcaption>
    <ul class="radar-lista">${lista}</ul>
  </figure>`;
}

function vPerfil(app) {
  const res = resultados();
  app.innerHTML = `
  <div class="stack"><div class="eyebrow">Tu perfil</div><h2>${esc(S.nombre.split(" ")[0] || "")}${S.nombre ? ", este" : "Este"} es el resultado de tu autodiagnóstico</h2>
  <p class="lede">Para cada dimensión calculamos el promedio de tus respuestas, de 1 a 5.</p>
  <table class="niveles"><thead><tr><th>Nivel</th><th>Promedio</th></tr></thead><tbody>${["f", "d", "c"].map((l, i) => `<tr><td>${chip(l)}</td><td>${["1,0 a 2,4", "2,5 a 3,7", "3,8 a 5,0"][i]}</td></tr>`).join("")}</tbody></table></div>
  ${radar(res)}
  ${res.map(r => { const t = r.d[r.lvl]; return `<article class="dim">
    <div class="dim-top" style="background:var(--c${r.i + 1})"><span class="ico">${ico(r.i, 6)}</span><h3>${r.i + 1}. ${esc(r.d.nm)}</h3></div>
    <div class="dim-body">
    <div class="dim-row">${chip(r.lvl)}<span class="note">Promedio <strong>${fmt1(r.prom)}</strong></span></div>
    <p>${esc(t[0])}</p>
    <p class="rec"><b>${r.lvl === "c" ? REC_C : REC_F}</b>${esc(t[1].charAt(0).toUpperCase() + t[1].slice(1))}</p>
  </div></article>`; }).join("")}
  <div class="cierre"><h3>No existe un único camino para avanzar con micro:bit.</h3>
    <p>Tu perfil refleja tu momento actual y puede cambiar a medida que experimentás, aprendés y compartís con otros.</p>
    <p>Nuestra sugerencia es que uses estas orientaciones para elegir qué dimensión fortalecer y, a partir de esa reflexión, puedas utilizar la Guía según tus propios intereses y necesidades.</p></div>
  <div class="btns"><button class="btn ghost" disabled>Descargar mi perfil (PDF)</button><span class="note">En la versión final se genera el PDF y también se envía a ${esc(S.email)}.</span></div>
  ${filaGuardada(res)}
  <div class="btns"><button class="btn ghost" id="again">Empezar de nuevo</button></div>`;
  $("#again").onclick = () => { S = blank(); go(0); };
}

function filaGuardada(res) {
  const c = S.centro, f = S.fecha || new Date();
  const p = n => String(n).padStart(2, "0");
  const rows = [
    ["fecha_hora", `${f.getFullYear()}-${p(f.getMonth() + 1)}-${p(f.getDate())} ${p(f.getHours())}:${p(f.getMinutes())}`],
    ["version_instrumento", VERSION], ["nombre", S.nombre], ["cedula", cedulaDigits(S.cedula)], ["email", S.email.trim().toLowerCase()],
    ["subsistema", S.sub], ["departamento", S.dep], ["localidad", S.dep === MVD ? "(no se pide)" : S.loc],
    ["centro_texto", S.centroTexto], ["centro_codigo", c ? c.cod : ""], ["origen_macheo", S.origen],
    ...CTX.map((q, i) => [`ctx_${i + 1}`, `${S.ctx[i] + 1} · ${q.o[S.ctx[i]]}`]),
    ...S.r.map((v, k) => [`d${Math.floor(k / 3) + 1}_i${k % 3 + 1}`, v]),
    ...res.map(r => [`d${r.i + 1}_suma`, r.suma]), ...res.map(r => [`d${r.i + 1}_nivel`, LVL[r.lvl]]),
  ];
  return `<details class="team"><summary>Para el equipo del programa: así se guardaría esta respuesta</summary>
    <p class="note" style="margin-top:10px">Una fila en la pestaña Respuestas de la Sheet (${rows.length} columnas). El docente no ve esta sección en la versión final.</p>
    <div class="tbl"><table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table></div></details>`;
}
